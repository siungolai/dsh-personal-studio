# dsh-personal-studio bundle patch: inserts the plugin's Loader row into a
# profile.
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-personal-studio@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-personal-studio` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like the manual cordis.patch.yml mount line used
# before. No profile file edits needed — one command installs and mounts.
#
# If the profile still carries the old manual mount line in its own
# cordis.patch.yml, remove it before switching to the bundle channel: two
# mounts of the same row are harmless at runtime (measured on dsh 0.2.1-rc.2
# the later row wins and the plugin works), but they leave two rows with the
# same id in the composed config, which is confusing to debug.
#
# Aggregate double-mount guard: aggregate bundles (e.g. @linxin666/dsh-web-ui-all)
# may already mount this package under their own entry id. Two mounts register
# /personal-studio/api twice and fail the whole plugin tree at boot ("duplicate
# prefix route"). The `!!js` disabled expression backs THIS row off when
# another *enabled* entry already mounts `dsh-personal-studio`; the aggregate
# instance then owns the routes. The loader evaluates it when this row is
# processed (entry-list order, only rows before this one are visible), so the
# aggregate bundle must precede this one in `dsh.profile.bundles` — the
# standard install order, since `dsh plugin add` appends new bundles last. The
# reverse order (this bundle before the aggregate) is a known limitation: the
# guard cannot see rows that come after it, and no runtime singleton guard is
# added. Same-id manual duplicates are not an error either: measured on
# dsh 0.2.1-rc.2 they resolve to one mount (the later row wins) and the plugin
# works normally, but the composed config then carries two rows with the same
# id, which is easy to misread while debugging.
- insert:
    - id: dsh-personal-studio
      name: dsh-personal-studio
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-personal-studio' && e.options.id !== 'dsh-personal-studio' && !e.disabled)"
